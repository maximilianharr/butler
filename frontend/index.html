<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butler</title>
  <!-- crossorigin=use-credentials: manifest fetches omit credentials by default and would 401 behind basic auth -->
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <meta name="theme-color" content="#0c1f28">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <div id="app">
    <!-- Thin icon strip on the far left -->
    <nav id="activity-bar" aria-label="Plugin navigation">
      <div id="ab-top"></div>
      <div id="ab-bottom"></div>
    </nav>

    <!-- Collapsible left panel (file tree, search results) -->
    <aside id="side-panel" class="collapsed" aria-label="Side panel">
      <header id="sp-header">
        <h2 id="sp-title"></h2>
        <button id="sp-close" aria-label="Close panel">&times;</button>
      </header>
      <div id="sp-content"></div>
    </aside>

    <!-- Resize handle between side panel and main area -->
    <div id="resize-handle" class="collapsed"></div>

    <!-- Main content area -->
    <main id="main-area">
      <header id="main-header">
        <div id="tab-bar"></div>
        <div id="main-actions"></div>
      </header>
      <div id="main-content">
        <div id="welcome">
          <div class="welcome-icon">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 6h36v36H6z"/>
              <path d="M14 16h20M14 24h16M14 32h12"/>
            </svg>
          </div>
          <h1>Butler</h1>
          <p>Your life in markdown.</p>
          <div class="welcome-shortcuts">
            <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> Search &nbsp;
            <kbd>Ctrl</kbd>+<kbd>B</kbd> Files &nbsp;
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Tab context menu -->
  <div id="tab-context-menu" class="context-menu">
    <button data-action="close">Close</button>
    <button data-action="close-others">Close Others</button>
    <button data-action="close-all">Close All</button>
    <button data-action="open-location">Open File Location</button>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
