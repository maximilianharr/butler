events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging to shared volume (picked up by Promtail → Loki) ────────
    access_log /usr/src/logs/nginx-access.log;
    error_log  /usr/src/logs/nginx-error.log;

    # HTTP server block - redirects to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server block
    server {
        listen 443 ssl http2;
        ssl_certificate /etc/nginx/ssl/dashboard.crt;
        ssl_certificate_key /etc/nginx/ssl/dashboard.key;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        server_name _;

        location / {
            root /usr/src/app/server/frontend;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to your backend container
        location /api/ {
            proxy_pass http://butler-api-server:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Handle CORS if needed
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        }

        # Proxy Grafana observability dashboard (served under /grafana/ subpath)
        # Grafana is in the same pod, reachable via localhost:3000
        location /grafana/ {
            proxy_pass http://localhost:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Grafana Live
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Loki log ingestion endpoint — exposed for remote log shipping (e.g. FastAPI).
        # Only the push path is proxied; query endpoints stay internal (use Grafana).
        # Loki runs at localhost:3100 inside the shared pod network namespace.
        location /loki/api/v1/push {
            proxy_pass http://localhost:3100/loki/api/v1/push;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Loki push requests can be large (batched log payloads)
            client_max_body_size 10m;
        }
    }
}