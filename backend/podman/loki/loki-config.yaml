# =============================================================================
# Loki Configuration — Minimal single-instance setup
# =============================================================================
# Local filesystem storage with 60-day retention.
# Designed for a single Loki instance running inside a Podman pod.
# For production clusters, switch to object storage (S3/GCS) and add replicas.

auth_enabled: false                       # No multi-tenancy needed

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1                   # Single instance — no replication
  ring:
    kvstore:
      store: inmemory                     # No external KV store needed

# Schema defines how index and chunks are stored
schema_config:
  configs:
    - from: "2020-10-24"
      store: tsdb                         # Modern index store (Loki 2.9+)
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retention: automatically delete logs older than 60 days
limits_config:
  retention_period: 1440h                 # 60 days (60 × 24h)

# Compactor handles retention enforcement
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Embedded cache for query results (avoids external Redis/Memcached)
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
