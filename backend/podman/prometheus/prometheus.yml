# =============================================================================
# Prometheus Configuration — Butler Monitoring Stack
# =============================================================================
# Scrapes system metrics from node-exporter and PostgreSQL metrics from
# postgres-exporter. Both exporters run in the same pod, reachable at localhost.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # System metrics (CPU, memory, disk, network) from node-exporter
  - job_name: "node-exporter"
    static_configs:
      - targets: ["localhost:9100"]
